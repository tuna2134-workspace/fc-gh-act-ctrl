server:
  # リバースプロキシを使う場合は 127.0.0.1:8080 にして直接公開を避ける
  listen: "0.0.0.0:8080"
  webhook_path: "/webhook"
  health_path: "/healthz"
  ready_path: "/readyz"
  metrics_path: "/metrics"
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 30s

log:
  level: info
  format: json

github:
  app_id: 123456
  private_key_path: /etc/fcghact/app.pem
  # Prefer webhook_secret_file so the secret is not stored in this file.
  webhook_secret_file: /etc/fcghact/webhook_secret
  # webhook_secret: "change-me"
  base_url: https://api.github.com
  # installation_id: 0    # resolved from the webhook payload when unset
  scope: repo            # repo | org
  repositories: []       # e.g. ["tuna2134-workspace/example"]; empty = every installation
  organizations: []

runner:
  # Labels the JIT runner advertises. They are sent to generate-jitconfig
  # as-is; GitHub does not add self-hosted/OS/arch automatically.
  labels: ["self-hosted", "linux", "x64", "fcghact"]
  # A job must carry all of these labels before the controller will run it.
  require_labels: ["fcghact"]
  # Advertise cpu-<n>, memory-<n>g and disk-<n>g labels automatically.
  resource_labels: true
  runner_group_id: 1
  work_folder: /opt/actions-runner/_work
  name_prefix: fcghact
  max_concurrent_jobs: 4
  max_jobs_per_repo: 2
  queue_size: 128
  boot_timeout: 3m
  registration_timeout: 5m
  job_timeout: 60m
  monitor_interval: 30s

# 固定プラン。ジョブは runs-on: [self-hosted, fcghact, spec-<name>] で選ぶ。
# 0 / 未指定の値は firecracker.* を継承する。disk_size はベース rootfs より
# 小さい場合はベースサイズになる (縮小はしない)。
plans:
  mini-1:
    vcpu_count: 2
    mem_size_mib: 2048
    disk_size: 8G
  mini-2:
    vcpu_count: 4
    mem_size_mib: 8192
    disk_size: 16G
  # spec-* を指定しないジョブの既定プランにする場合
  # default:
  #   vcpu_count: 2
  #   mem_size_mib: 2048
  #   disk_size: 8G

firecracker:
  binary: /usr/local/bin/firecracker
  kernel_image: /var/lib/fcghact/vmlinux
  rootfs_image: /var/lib/fcghact/rootfs.ext4
  state_dir: /var/lib/fcghact
  vcpu_count: 2
  mem_size_mib: 2048
  boot_args: "console=ttyS0 quiet loglevel=3 reboot=k panic=1 pci=off net.ifnames=0 root=/dev/vda rw rootfstype=ext4"
  log_level: Warning
  # reflink uses FICLONE for instant copy-on-write rootfs clones. It falls back
  # to a full copy on filesystems that do not support it.
  reflink: true
  # Copy console.log / firecracker.log to <state_dir>/logs/<vm-id>/ on exit.
  keep_logs: false
  # Keep ready rootfs clones so VM start does not wait for the copy.
  # Each entry consumes the used size of the base rootfs. 0 disables.
  preclone_pool: 2

rootfs:
  # When set, the guest rootfs is pulled from an OCI registry at startup and
  # firecracker.rootfs_image is replaced by the cached extraction.
  # e.g. ghcr.io/tuna2134-workspace/fcghact-rootfs:v1
  oci_reference: ""
  # Defaults to <firecracker.state_dir>/images.
  cache_dir: ""
  # Prefer token_env so the token is not stored in this file.
  token: ""
  token_env: ""        # e.g. GHCR_TOKEN
  insecure: false      # allow plain HTTP registries (testing only)
  prune: true          # remove cached layers other than the active one

network:
  manage_bridge: true
  bridge: fcghact0
  cidr: 172.31.0.0/16
  gateway: 172.31.0.1
  dns: ["1.1.1.1", "8.8.8.8"]
  mtu: 1500
  tap_prefix: fctap
